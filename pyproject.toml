[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obj-tracking"
version = "0.1.0"
description = "Real-time object detection and tracking with YOLO and DeepSORT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "deep-sort-realtime>=1.3.2",
    "opencv-python>=4.8",
    "ultralytics>=8.3",
]

[project.scripts]
obj-tracking = "obj_tracking.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
