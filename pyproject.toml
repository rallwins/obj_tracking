[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obj-tracking"
version = "0.1.0"
description = "Real-time object detection and tracking with YOLO and DeepSORT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "deep-sort-realtime>=1.3.2",
    "fastapi>=0.115",
    "opencv-python>=4.8",
    "python-multipart>=0.0.12",
    "ultralytics>=8.3",
    "uvicorn>=0.30",
]

[project.scripts]
obj-tracking = "obj_tracking.pipeline:main"
obj-tracking-server = "obj_tracking.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
obj_tracking = ["static/*"]
